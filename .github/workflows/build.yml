name: Build rule-sets

on:
  push:
    branches: [main]
    paths: ["lists/**", "convert.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert domain lists
        run: python convert.py

      - name: Get version tag
        id: ver
        run: echo "tag=v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build release notes
        run: |
          REPO="https://github.com/${{ github.repository }}/releases/download"
          for TAG in "${{ steps.ver.outputs.tag }}" "latest"; do
            {
              echo "## Download URLs"
              echo ""
              for f in output/srs/*.srs; do
                NAME=$(basename "$f")
                echo "- [\`${NAME}\`](${REPO}/${TAG}/${NAME})"
              done
            } > "notes-${TAG}.md"
          done

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" output/srs/*.srs \
            --title "Rule Sets ${{ steps.ver.outputs.tag }}" \
            --notes-file "notes-${{ steps.ver.outputs.tag }}.md" \
            --latest=false

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest output/srs/*.srs \
            --title "Rule Sets (latest)" \
            --notes-file notes-latest.md \
            --latest
